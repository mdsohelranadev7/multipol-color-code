<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="src/all.min.css">
</head>

<body id="sk">
    <div class="flex justify-end max-w-main bg-amber-500 mx-auto">
        <!-- <button id="cl" onclick="sdf()"></button> -->
        <span class="text-2xl p-3" id="cl" onclick="sdf()"><i class="fa-solid fa-moon"></i></span>
        <!-- <button id="csl">click</button> -->
        <span class="text-2xl p-3" id="csl"><i class="fa-regular fa-lightbulb"></i></span>
    </div>

    <div id="hext"
        class=" relative max-w-main mx-auto py-30 bg-[#f73d25] mt-2 text-center flex items-center justify-center flex-col">
        <h2 class=" text-4xl uppercase">change the color</h2>
        <div class="flex items-center ">
            <input id="input" class="block text-center m-5 border" type="text" placeholder="Enter Your Color">
            <button class=" rounded-2xl hover:bg-red-300 hover:text-black w-16 bg-gray-600 text-white"
                id="copybtn">copy</button>
        </div>
        <button id="clbtn"
            class="border border-[#DDE097] px-5 py-3 text-white bg-black rounded-2xl hover:bg-amber-100 hover:text-black duration-500 ">change
            color</button>


        <div id="tst" class="absolute top-0 right-0 m-4 border translate-x-full duration-500 opacity-0">copy success
        </div>
    </div>




    <div class="max-w-main mx-auto bg-gray-400 h-111 mt-2 flex justify-center items-center flex-col">
        <h2 id="text" class="">hello</h2>
        <button id="deletes" class="border px-2 mt-3">Delete</button>
    </div>
















    <!-- start part -->

    <div id="startPart" class="w-285 mx-auto h-260 my-5 flex justify-center items-center flex-col border">


        <h2 class="mt-83.75 mb-9 text-[48px] font-semibold">Wanna Play game?</h2>
        <input id="inputs" class="border w-217 h-33 rounded-[80px] pl-13 text-[32px] text-[#d9d9d9]" type="text"
            placeholder="Enter your name">
        <button id="startbtn"
            class="px-21.5 py-3.75 bg-[#7041D3] mt-9 mb-11.5 rounded-[55px] text-[32px] font-bold cursor-pointer">Start
            Game</button>

        <span id="nameMiss" class="text-[48px] font-bold py-2 px-45.25 bg-[#CC3030] text-white" hidden>Name Is
            Missing</span>

    </div>

    <!-- start end -->




    <!-- start start -->


    <div id="playerOne" class="w-285 mx-auto h-260 my-5 flex justify-center items-center flex-col border" hidden>


        <h2 class="mt-83.75 mb-9 text-[48px] font-semibold">Player - 1</h2>
        <input id="inputTwo" class="border w-217 h-33 rounded-[80px] pl-13 text-[32px] text-[#d9d9d9]" type="text"
            placeholder="Give a number">
        <button id="letsPlay"
            class="px-21.5 py-3.75 bg-[#7041D3] mt-9 mb-11.5 rounded-[55px] text-[32px] font-bold cursor-pointer">Let’s
            Play</button>

        <span id="giveNumber" class="text-[48px] font-bold py-2 px-45.25 bg-[#CC3030] text-white" hidden>Please give a
            number</span>

    </div>
    <!-- start end -->











    <div class=" flex justify-center items-center flex-col mb-10  ">


        <h2 id="counter" class="">0</h2>

        <div class="flex gap-x-2">
            <button id="plus" class="px-15 bg-amber-200 py-5  mt-5">+</button>
            <button id="minus" class="px-15 bg-amber-200 py-5  mt-5">-</button>
        </div>


    </div>





    <div class="flex justify-center items-center flex-col mb-10 text-2xl">
        <h1>Stop Watch</h1>
        <!-- <input type="text" class=" border"> -->
        <h2 id="timer">00:00.00</h2>
        <div class="">
            <button id="start" class=" px-5 bg-amber-200 py-2 mt-3">Start</button>
            <button id="stop" class=" px-5 bg-amber-200 py-2 mt-3">Stop</button>
        </div>
    </div>





    <script src="js/script.js"></script>
</body>

</html>
